plugins:
- name: ctier
  config:
    tier: 4
    deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
    excluded: false
    governed-set:
    - getBalance
    - closeAccount
    - exportStatements
    - listTransactions
    - updateFeatureFlags
    - modifyCreditLimit
    - recordKycDecision
    - updateCommunicationPreferences
    - updateDisplayPreferences
    - updateCustomerProfile
    - raiseDispute
    - initiatePayment
    - getPaymentAuthorization
    - deleteSavedSearch
    - restoreSavedSearch
    custody_url: http://custody:8080
    custody_timeout_ms: 200
    floor_poll_ms: 1000
