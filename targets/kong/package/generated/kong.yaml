        floor_poll_ms: 1000
  - name: initiatePayment
    methods:
    - POST
    paths:
    - ~/payments$
    strip_path: false
    regex_priority: 1
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 4
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: initiatePayment
        excluded: false
        required_scope: operation-initiatePayment
        handoff_authority: payment-operations
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: getPaymentAuthorization
    methods:
    - GET
    paths:
    - ~/payments/(?<paymentId>[^/]+)/authorizations/(?<authorizationId>[^/]+)$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 4
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: getPaymentAuthorization
        excluded: false
        required_scope: operation-getPaymentAuthorization
        handoff_authority: payment-operations
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: deleteSavedSearch
    methods:
    - DELETE
    paths:
    - ~/saved\-searches/(?<searchId>[^/]+)$
    strip_path: false
    regex_priority: 1
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 2
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: deleteSavedSearch
        excluded: false
