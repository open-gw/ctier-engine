    - ~/customers/(?<customerId>[^/]+)/preferences/communication$
    strip_path: false
    regex_priority: 3
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 3
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: updateCommunicationPreferences
        excluded: false
        required_scope: operation-updateCommunicationPreferences
        handoff_authority: communications
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: updateDisplayPreferences
    methods:
    - PUT
    paths:
    - ~/customers/(?<customerId>[^/]+)/preferences/display$
    strip_path: false
    regex_priority: 3
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 2
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: updateDisplayPreferences
        excluded: false
        required_scope: operation-updateDisplayPreferences
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: updateCustomerProfile
    methods:
    - PUT
    paths:
    - ~/customers/(?<customerId>[^/]+)/profile$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 3
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: updateCustomerProfile
        excluded: false
        required_scope: operation-updateCustomerProfile
        handoff_authority: customer-service
