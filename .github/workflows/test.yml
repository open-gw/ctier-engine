name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Offline suite (socket-blocked, no docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Offline only. pytest -q is socket-blocked (see tests/conftest.py).
      # The live suite (pytest --live) needs a Kong/APISIX rig and is not run here.
      - run: python -m pytest -q
