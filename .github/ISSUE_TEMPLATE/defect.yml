name: Defect
description: Something the classifier or docs get wrong.
title: "[defect] "
labels: ["defect"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you observed, and what you expected.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Conformance
      description: Which criterion (C1–C13) or ADR this violates, if any.
    validations:
      required: false
