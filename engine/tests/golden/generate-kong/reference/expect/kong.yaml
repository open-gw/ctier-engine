services:
- name: retail-banking-api-consequence-tiered-reference
  url: https://api.example-bank.com/v1
  routes:
  - name: getBalance
    methods:
    - GET
    paths:
    - ~/accounts/(?<accountId>[^/]+)/balance$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 1
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: getBalance
        excluded: false
        required_scope: operation-getBalance
