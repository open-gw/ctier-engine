_format_version: '3.0'
consumers:
- username: ctier-agents
  jwt_secrets:
  - algorithm: RS256
    key: ctier
    secret: unused-rs256
    rsa_public_key: '-----BEGIN PUBLIC KEY-----

      LOCAL-DEV-ONLY-NOT-A-REAL-PUBLIC-KEY-SEE-engine-ctier-authz-README

      -----END PUBLIC KEY-----

      '
services:
- name: retail-banking-api-consequence-tiered-reference
  url: https://api.example-bank.com/v1
  routes:
  - name: getBalance
    methods:
    - GET
    paths:
    - ~/accounts/(?<accountId>[^/]+)/balance$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 1
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: getBalance
        excluded: false
        required_scope: operation-getBalance
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: closeAccount
    methods:
    - POST
    paths:
    - ~/accounts/(?<accountId>[^/]+)/closure$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 4
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: closeAccount
        excluded: true
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: exportStatements
    methods:
    - POST
    paths:
    - ~/accounts/(?<accountId>[^/]+)/statements/export$
    strip_path: false
    regex_priority: 3
  - name: listTransactions
    methods:
    - GET
    paths:
    - ~/accounts/(?<accountId>[^/]+)/transactions$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 2
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: listTransactions
        excluded: false
        required_scope: operation-listTransactions
        bound_parameter: limit
        bound_max: 100
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: updateFeatureFlags
    methods:
    - PUT
    paths:
    - ~/config/feature\-flags$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 4
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: updateFeatureFlags
        excluded: false
        required_scope: operation-updateFeatureFlags
        handoff_authority: operator
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: modifyCreditLimit
    methods:
    - PATCH
    paths:
    - ~/credit/(?<accountId>[^/]+)/limit$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
        claims_to_verify:
        - exp
        header_names:
        - authorization
    - name: ctier
      config:
        tier: 3
        deployment: sha256:cbbddcc056749e21fa111ce65cc7730b6236cee3fd3b967b511010e88dbfeec8
        operation: modifyCreditLimit
        excluded: false
        required_scope: operation-modifyCreditLimit
        handoff_authority: credit-operations
        custody_url: http://custody:8080
        custody_timeout_ms: 200
        floor_poll_ms: 1000
  - name: recordKycDecision
    methods:
    - POST
    paths:
    - ~/customers/(?<customerId>[^/]+)/kyc\-decision$
    strip_path: false
    regex_priority: 2
    plugins:
    - name: jwt
      config:
        key_claim_name: cid
